<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>予約確認 | TRAD パーソナルコンディショニングジム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-blue: #0B3D91;
      --brand-blue-light: #1565C0;
      --brand-blue-pale: #E3F2FD;
      --white: #FFFFFF;
      --gray-50: #FAFAFA;
      --gray-100: #F5F5F5;
      --gray-200: #EEEEEE;
      --gray-300: #E0E0E0;
      --gray-500: #9E9E9E;
      --gray-600: #757575;
      --gray-700: #616161;
      --gray-900: #212121;
      --success: #2E7D32;
      --danger: #C62828;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }
    .header {
      background: var(--brand-blue);
      color: var(--white);
      padding: 16px 20px;
      text-align: center;
    }
    .header-brand { font-size:24px; font-weight:900; letter-spacing:4px; }
    .container { max-width:480px; margin:0 auto; padding:24px 16px; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-title { font-size:16px; font-weight:700; margin-bottom:16px; }
    .info-row { display:flex; padding:10px 0; border-bottom:1px solid var(--gray-100); }
    .info-row:last-child { border-bottom:none; }
    .info-label { width:90px; font-size:13px; color:var(--gray-600); flex-shrink:0; }
    .info-value { font-size:15px; font-weight:500; }

    .status-badge {
      display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700;
    }
    .status-confirmed { background:#E8F5E9; color:var(--success); }
    .status-cancelled { background:#FFEBEE; color:var(--danger); }

    .btn {
      width:100%; padding:14px; border:none; border-radius:var(--radius-sm);
      font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; margin-bottom:8px;
    }
    .btn-danger { background:var(--danger); color:var(--white); }
    .btn-danger:hover { background:#B71C1C; }
    .btn-outline { background:var(--white); color:var(--gray-700); border:2px solid var(--gray-300); }
    .btn-outline:hover { background:var(--gray-50); }

    .msg { padding:16px; border-radius:var(--radius-sm); font-size:14px; margin-bottom:16px; text-align:center; }
    .msg-error { background:#FFEBEE; color:var(--danger); }
    .msg-success { background:#E8F5E9; color:var(--success); }
    .msg-info { background:var(--brand-blue-pale); color:var(--brand-blue); }

    .loading { text-align:center; padding:60px 20px; color:var(--gray-500); }
    .spinner { width:32px; height:32px; border:3px solid var(--gray-200); border-top-color:var(--brand-blue); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .recurring-note { background:#FFF3E0; color:#E65100; padding:12px 16px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:16px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-brand">TRAD<span style="font-size:10px;vertical-align:super;">™</span></div>
  </div>

  <div class="container">
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        予約情報を読み込んでいます...
      </div>
    </div>
  </div>

  <script>
    var API_BASE = 'https://script.google.com/macros/s/AKfycbxzphUXhjAEwxFsj6napghnfRZh7R7p15L_iDfKwM9p56wdRrDsIbQrXzggFdqjgihY/exec';
    var API_TIMEOUT_MS = 20000;
    var API_RETRY_MAX = 2;

    // JSONP helpers with timeout/retry/cache-busting
    var _jid = 0;
    function buildQuery(params) {
      return Object.keys(params || {}).filter(function(k) { return params[k] !== undefined && params[k] !== null; })
        .map(function(k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
        .join('&');
    }
    function makeApiUrl(params) {
      var p = {};
      Object.keys(params || {}).forEach(function(k) { p[k] = params[k]; });
      p.authuser = '0';
      p._ = Date.now() + '_' + Math.floor(Math.random() * 1000000);
      return API_BASE + '?' + buildQuery(p);
    }
    function cleanupJsonp(name, timer) {
      if (timer) clearTimeout(timer);
      try { delete window[name]; } catch(e) { window[name] = undefined; }
      var el = document.getElementById(name);
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
    function jsonpRequest(params, cb, attempt) {
      attempt = attempt || 0;
      var n = '_gcb_' + (++_jid) + '_' + Math.floor(Math.random() * 1000000);
      var done = false;
      var timer = null;
      function finish(err, data) {
        if (done) return;
        done = true;
        cleanupJsonp(n, timer);
        if (err && attempt < API_RETRY_MAX) {
          setTimeout(function() { jsonpRequest(params, cb, attempt + 1); }, 800 * (attempt + 1));
          return;
        }
        cb(err, data);
      }
      window[n] = function(d) { finish(null, d); };
      var req = {};
      Object.keys(params || {}).forEach(function(k) { req[k] = params[k]; });
      req.callback = n;
      var s = document.createElement('script');
      s.id = n;
      s.async = true;
      s.referrerPolicy = 'no-referrer';
      s.src = makeApiUrl(req);
      s.onerror = function() { finish(new Error('接続エラー')); };
      timer = setTimeout(function() { finish(new Error('タイムアウト')); }, API_TIMEOUT_MS);
      document.body.appendChild(s);
    }
    function gasGet(params, cb) { jsonpRequest(params, cb); }
    function gasPost(body, cb) { jsonpRequest({ payload: JSON.stringify(body) }, cb); }

    var token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('content').innerHTML =
        '<div class="msg msg-error">予約トークンが見つかりません。確認メールのリンクからアクセスしてください。</div>';
    } else {
      loadReservation();
    }

    function loadReservation() {
      gasGet({ action: 'getReservation', token: token }, function(err, data) {
        if (err || !data) {
          document.getElementById('content').innerHTML = '<div class="msg msg-error">接続エラーが発生しました。</div>';
          return;
        }
        if (data.error) {
          document.getElementById('content').innerHTML = '<div class="msg msg-error">' + data.error + '</div>';
          return;
        }
        renderReservation(data.reservation);
      });
    }

    function renderReservation(r) {
      var dateObj = new Date(r.date + 'T00:00:00');
      var dayNames = ['日','月','火','水','木','金','土'];
      var dateStr = dateObj.getFullYear() + '年' + (dateObj.getMonth()+1) + '月' +
        dateObj.getDate() + '日（' + dayNames[dateObj.getDay()] + '）';

      var statusClass = r.status === 'confirmed' ? 'status-confirmed' : 'status-cancelled';
      var statusText = r.status === 'confirmed' ? '確定' : 'キャンセル済み';

      var html = '<div class="card">' +
        '<div class="card-title">ご予約内容 <span class="status-badge ' + statusClass + '">' + statusText + '</span></div>' +
        '<div class="info-row"><div class="info-label">お名前</div><div class="info-value">' + r.customer_name + '</div></div>' +
        '<div class="info-row"><div class="info-label">メニュー</div><div class="info-value">' + r.menu + '（' + r.duration_min + '分）</div></div>' +
        '<div class="info-row"><div class="info-label">日時</div><div class="info-value">' + dateStr + ' ' + r.start_time + '〜' + r.end_time + '</div></div>' +
        '</div>';

      if (r.is_recurring) {
        html += '<div class="recurring-note">この予約は繰り返し予約です。変更・キャンセルはジムに直接ご連絡ください。</div>';
      } else if (r.can_modify && r.status === 'confirmed') {
        // 変更フォーム
        html += '<div class="card" style="margin-top:16px;">' +
          '<div class="card-title">予約を変更する</div>' +
          '<div style="margin-bottom:12px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">新しい日付</label>' +
            '<input type="date" id="changeDateInput" style="width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;" onchange="loadChangeSlots()">' +
          '</div>' +
          '<div style="margin-bottom:12px;">' +
            '<label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">新しい時間</label>' +
            '<select id="changeTimeSelect" style="width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;">' +
              '<option value="">日付を選択してください</option>' +
            '</select>' +
          '</div>' +
          '<button class="btn" style="background:var(--brand-blue);color:#fff;" onclick="submitChange()">予約を変更する</button>' +
        '</div>';

        html += '<div style="margin-top:12px;">' +
          '<button class="btn btn-danger" onclick="cancelReservation()">この予約をキャンセル</button>' +
          '</div>' +
          '<p style="font-size:12px;color:var(--gray-500);text-align:center;margin-top:8px;">前日23:59まで変更・キャンセルが可能です。</p>';
      } else if (r.status === 'confirmed') {
        html += '<div class="msg msg-info">変更・キャンセル期限（前日23:59）を過ぎています。直接ご連絡ください。</div>';
      }

      document.getElementById('content').innerHTML = html;
      currentResv = r;
    }

    var currentResv = null;

    function loadChangeSlots() {
      if (!currentResv) return;
      var date = document.getElementById('changeDateInput').value;
      if (!date) return;
      var sel = document.getElementById('changeTimeSelect');
      sel.innerHTML = '<option value="">読み込み中...</option>';

      gasGet({ action: 'getSlots', date: date, menu: currentResv.menu }, function(err, data) {
        sel.innerHTML = '<option value="">時間を選択</option>';
        if (err || !data || !data.slots) return;
        data.slots.forEach(function(s) {
          if (s.available) {
            sel.innerHTML += '<option value="' + s.time + '">' + s.time + ' ◯</option>';
          }
        });
        if (sel.options.length <= 1) {
          sel.innerHTML = '<option value="">空き枠がありません</option>';
        }
      });
    }

    function submitChange() {
      if (!currentResv) return;
      var newDate = document.getElementById('changeDateInput').value;
      var newTime = document.getElementById('changeTimeSelect').value;
      if (!newDate || !newTime) { alert('日付と時間を選択してください。'); return; }
      if (!confirm('予約を変更しますか？')) return;

      gasPost({ action: 'changeReservation', token: token, new_date: newDate, new_start_time: newTime }, function(err, data) {
        if (err || !data) { alert('接続エラーが発生しました。'); return; }
        if (data.error) { alert(data.error); return; }
        document.getElementById('content').innerHTML =
          '<div class="msg msg-success">予約を変更しました。</div>' +
          '<p style="text-align:center;margin-top:12px;color:var(--gray-600);font-size:14px;">変更確認メールをお送りしました。</p>';
      });
    }

    function cancelReservation() {
      if (!confirm('この予約をキャンセルしますか？')) return;

      gasPost({ action: 'cancelReservation', token: token }, function(err, data) {
        if (err || !data) { alert('接続エラーが発生しました。'); return; }
        if (data.error) { alert(data.error); return; }
        document.getElementById('content').innerHTML =
          '<div class="msg msg-success">予約をキャンセルしました。</div>' +
          '<p style="text-align:center;margin-top:12px;color:var(--gray-600);font-size:14px;">またのご利用をお待ちしております。</p>';
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約 | TRAD パーソナルコンディショニングジム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-blue: #0B3D91;
      --brand-blue-light: #1565C0;
      --brand-blue-pale: #E3F2FD;
      --brand-blue-dark: #062657;
      --white: #FFFFFF;
      --gray-50: #FAFAFA;
      --gray-100: #F5F5F5;
      --gray-200: #EEEEEE;
      --gray-300: #E0E0E0;
      --gray-400: #BDBDBD;
      --gray-500: #9E9E9E;
      --gray-600: #757575;
      --gray-700: #616161;
      --gray-800: #424242;
      --gray-900: #212121;
      --success: #2E7D32;
      --danger: #C62828;
      --warning: #F57F17;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Header ===== */
    .header {
      background: var(--brand-blue);
      color: var(--white);
      padding: 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(11,61,145,0.3);
    }
    .header-logo {
      height: 32px;
      margin-bottom: 4px;
    }
    .header-title {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    /* ===== Progress Steps ===== */
    .progress {
      display: flex;
      justify-content: center;
      gap: 0;
      padding: 20px 16px 12px;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
    }
    .progress-step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gray-400);
      font-weight: 500;
    }
    .progress-step.active {
      color: var(--brand-blue);
    }
    .progress-step.done {
      color: var(--success);
    }
    .progress-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--gray-200);
      color: var(--gray-500);
    }
    .progress-step.active .progress-num {
      background: var(--brand-blue);
      color: var(--white);
    }
    .progress-step.done .progress-num {
      background: var(--success);
      color: var(--white);
    }
    .progress-arrow {
      color: var(--gray-300);
      margin: 0 8px;
      font-size: 14px;
    }

    /* ===== Container ===== */
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px 100px;
    }

    /* ===== Step sections ===== */
    .step-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .step-section.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 24px 0 16px;
      color: var(--gray-900);
    }

    /* ===== Menu Cards ===== */
    .menu-card {
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .menu-card:hover {
      border-color: var(--brand-blue-light);
      box-shadow: var(--shadow);
    }
    .menu-card.selected {
      border-color: var(--brand-blue);
      background: var(--brand-blue-pale);
    }
    .menu-name {
      font-size: 16px;
      font-weight: 700;
    }
    .menu-duration {
      font-size: 13px;
      color: var(--gray-600);
      margin-top: 4px;
    }
    .menu-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--gray-300);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .menu-card.selected .menu-check {
      border-color: var(--brand-blue);
      background: var(--brand-blue);
      color: var(--white);
    }

    /* ===== 2-Week Slot Table (かんざし風) ===== */
    .week-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 8px;
    }
    .week-nav-btn {
      background: none; border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm); padding: 8px 14px;
      cursor: pointer; font-size: 13px; color: var(--gray-700);
    }
    .week-nav-btn:hover { background: var(--gray-100); }
    .week-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .week-nav-label { font-size: 15px; font-weight: 700; }

    .slot-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 20px;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
    }
    .slot-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 500px;
    }
    .slot-table th {
      background: var(--gray-50);
      padding: 8px 2px;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      border-bottom: 2px solid var(--gray-200);
      position: sticky; top: 0; z-index: 2;
      line-height: 1.4;
    }
    .slot-table th.sun { color: var(--danger); }
    .slot-table th.sat { color: var(--brand-blue); }
    .slot-table th.tue { color: var(--gray-400); }
    .slot-table th.today-col { background: var(--brand-blue-pale); }
    .slot-table th.closed-col { background: #f0f0f0; color: var(--gray-400); }
    .slot-table th.past-col { background: #f5f5f5; color: var(--gray-400); }

    .slot-table td {
      text-align: center;
      padding: 6px 2px;
      border-bottom: 1px solid var(--gray-100);
      border-right: 1px solid var(--gray-100);
      min-width: 36px;
      height: 32px;
    }
    .slot-table td:first-child {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-600);
      background: var(--gray-50);
      position: sticky; left: 0; z-index: 1;
      min-width: 50px;
      border-right: 2px solid var(--gray-200);
    }
    .slot-table td.today-col { background: rgba(227,242,253,0.25); }
    .slot-table td.closed-col { background: #f5f5f5; }
    .slot-table td.past-col { background: #fafafa; }

    .slot-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .slot-mark.avail { color: var(--success); }
    .slot-mark.avail:hover { background: #E8F5E9; transform: scale(1.15); }
    .slot-mark.taken { color: var(--gray-300); cursor: default; }
    .slot-mark.closed { color: var(--gray-200); cursor: default; }
    .slot-mark.selected {
      background: var(--brand-blue); color: var(--white);
      transform: scale(1.1); box-shadow: 0 2px 8px rgba(11,61,145,0.3);
    }

    .slot-table-loading {
      text-align: center; padding: 40px; color: var(--gray-500);
    }

    /* ===== Form ===== */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--gray-700);
    }
    .form-label .required {
      color: var(--danger);
      margin-left: 4px;
      font-size: 11px;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--brand-blue);
    }

    /* ===== Confirm ===== */
    .confirm-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin: 24px 0;
    }
    .confirm-row {
      display: flex;
      padding: 12px 0;
      border-bottom: 1px solid var(--gray-100);
    }
    .confirm-row:last-child { border-bottom: none; }
    .confirm-label {
      width: 100px;
      font-size: 13px;
      color: var(--gray-600);
      flex-shrink: 0;
    }
    .confirm-value {
      font-size: 15px;
      font-weight: 500;
    }

    /* ===== Buttons ===== */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--brand-blue);
      color: var(--white);
    }
    .btn-primary:hover { background: var(--brand-blue-dark); }
    .btn-primary:disabled {
      background: var(--gray-300);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--white);
      color: var(--gray-700);
      border: 2px solid var(--gray-300);
      margin-top: 8px;
    }
    .btn-secondary:hover { background: var(--gray-50); }

    .btn-group {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: var(--white);
      border-top: 1px solid var(--gray-200);
      max-width: 480px;
      margin: 0 auto;
      z-index: 50;
    }

    /* ===== Complete ===== */
    .complete-icon {
      width: 64px;
      height: 64px;
      background: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 40px auto 20px;
      color: var(--white);
      font-size: 32px;
    }
    .complete-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .complete-subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 24px;
    }

    /* ===== Loading Overlay ===== */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--gray-200);
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: var(--gray-600);
    }

    /* ===== Error ===== */
    .error-msg {
      background: #FFEBEE;
      color: var(--danger);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div style="font-size:24px;font-weight:900;letter-spacing:4px;">TRAD<span style="font-size:10px;vertical-align:super;">™</span></div>
    <div class="header-title">PERSONAL CONDITIONING GYM</div>
  </div>

  <!-- Progress -->
  <div class="progress" id="progress">
    <div class="progress-step active" data-step="1">
      <span class="progress-num">1</span>
      <span>メニュー</span>
    </div>
    <span class="progress-arrow">›</span>
    <div class="progress-step" data-step="2">
      <span class="progress-num">2</span>
      <span>日時</span>
    </div>
    <span class="progress-arrow">›</span>
    <div class="progress-step" data-step="3">
      <span class="progress-num">3</span>
      <span>情報入力</span>
    </div>
    <span class="progress-arrow">›</span>
    <div class="progress-step" data-step="4">
      <span class="progress-num">4</span>
      <span>確認</span>
    </div>
  </div>

  <div class="container">

    <!-- Error message -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- ===== STEP 1: Menu Selection ===== -->
    <div class="step-section active" id="step1">
      <h2 class="section-title">メニューを選択</h2>
      <div id="menuList"></div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnStep1Next" disabled onclick="goToStep(2)">次へ — 日時を選択</button>
      </div>
    </div>

    <!-- ===== STEP 2: Date/Time Selection (2-week table) ===== -->
    <div class="step-section" id="step2">
      <h2 class="section-title">日時を選択</h2>
      <p style="font-size:13px;color:var(--gray-600);margin-bottom:8px;">
        選択中のメニュー: <strong id="step2MenuLabel"></strong>
        <a href="#" onclick="goToStep(1);return false;" style="color:var(--brand-blue);margin-left:8px;font-size:12px;">メニューを変更</a>
      </p>

      <div class="week-nav">
        <button class="week-nav-btn" id="weekPrev" onclick="changeWeekPage(-1)">‹ 前の週へ</button>
        <span class="week-nav-label" id="weekLabel"></span>
        <button class="week-nav-btn" id="weekNext" onclick="changeWeekPage(1)">次の週へ ›</button>
      </div>

      <div id="slotTableArea">
        <div class="slot-table-loading">
          <div class="spinner" style="margin:0 auto;"></div>
          <div style="margin-top:12px;">空き状況を読み込み中...</div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="btnStep2Next" disabled onclick="goToStep(3)">次へ — 情報入力</button>
        <button class="btn btn-secondary" onclick="goToStep(1)">戻る</button>
      </div>
    </div>

    <!-- ===== STEP 3: Customer Info ===== -->
    <div class="step-section" id="step3">
      <h2 class="section-title">お客様情報</h2>

      <div class="form-group">
        <label class="form-label">お名前<span class="required">必須</span></label>
        <input class="form-input" type="text" id="inputName" placeholder="例：山田 太郎" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label">メールアドレス<span class="required">必須</span></label>
        <input class="form-input" type="email" id="inputEmail" placeholder="例：taro@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">電話番号<span class="required">必須</span></label>
        <input class="form-input" type="tel" id="inputPhone" placeholder="例：090-1234-5678" autocomplete="tel">
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="btnStep3Next" onclick="goToStep(4)">次へ — 確認画面</button>
        <button class="btn btn-secondary" onclick="goToStep(2)">戻る</button>
      </div>
    </div>

    <!-- ===== STEP 4: Confirmation ===== -->
    <div class="step-section" id="step4">
      <h2 class="section-title">ご予約内容の確認</h2>

      <div class="confirm-card">
        <div class="confirm-row">
          <div class="confirm-label">メニュー</div>
          <div class="confirm-value" id="confirmMenu"></div>
        </div>
        <div class="confirm-row">
          <div class="confirm-label">日時</div>
          <div class="confirm-value" id="confirmDateTime"></div>
        </div>
        <div class="confirm-row">
          <div class="confirm-label">お名前</div>
          <div class="confirm-value" id="confirmName"></div>
        </div>
        <div class="confirm-row">
          <div class="confirm-label">メール</div>
          <div class="confirm-value" id="confirmEmail"></div>
        </div>
        <div class="confirm-row">
          <div class="confirm-label">電話番号</div>
          <div class="confirm-value" id="confirmPhone"></div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="btnSubmit" onclick="submitReservation()">予約を確定する</button>
        <button class="btn btn-secondary" onclick="goToStep(3)">戻る</button>
      </div>
    </div>

    <!-- ===== STEP 5: Complete ===== -->
    <div class="step-section" id="step5">
      <div class="complete-icon">✓</div>
      <h2 class="complete-title">ご予約ありがとうございます</h2>
      <p class="complete-subtitle">確認メールをお送りしました。<br>メールが届かない場合はお問い合わせください。</p>

      <div class="confirm-card">
        <div class="confirm-row">
          <div class="confirm-label">メニュー</div>
          <div class="confirm-value" id="completeMenu"></div>
        </div>
        <div class="confirm-row">
          <div class="confirm-label">日時</div>
          <div class="confirm-value" id="completeDateTime"></div>
        </div>
      </div>

      <p style="font-size:13px;color:var(--gray-600);text-align:center;margin-top:16px;">
        予約の変更・キャンセルは確認メールに記載のリンクから<br>前日23:59まで可能です。
      </p>

      <div style="margin-top:24px;">
        <button class="btn btn-primary" onclick="location.reload()">予約サイトトップへ戻る</button>
      </div>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">読み込み中...</div>
  </div>

  <script>
    // ===== CONFIG =====
    // ★ デプロイ後にGASのWebアプリURLに書き換える
    var API_BASE = 'https://script.google.com/macros/s/AKfycbxzphUXhjAEwxFsj6napghnfRZh7R7p15L_iDfKwM9p56wdRrDsIbQrXzggFdqjgihY/exec';

    // ===== JSONP通信ヘルパー（GAS CORS回避） =====
    var _jsonpId = 0;
    /**
     * GAS APIをJSONP（scriptタグ挿入）で呼び出す
     * GASのdoGetに callback パラメータを渡し、JSONP形式で返してもらう
     */
    function gasGet(params, callback) {
      var cbName = '_gasCallback_' + (++_jsonpId);
      window[cbName] = function(data) {
        delete window[cbName];
        var script = document.getElementById(cbName);
        if (script) script.remove();
        callback(null, data);
      };
      var qs = Object.keys(params).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }).join('&');
      var url = API_BASE + '?' + qs + '&callback=' + cbName;
      var script = document.createElement('script');
      script.id = cbName;
      script.src = url;
      script.onerror = function() {
        delete window[cbName];
        script.remove();
        callback(new Error('接続エラー'), null);
      };
      document.body.appendChild(script);
    }

    /**
     * POST相当の処理をGET経由のJSONPで実行
     * bodyをpayloadパラメータとして送る
     */
    function gasPost(body, callback) {
      var cbName = '_gasCallback_' + (++_jsonpId);
      window[cbName] = function(data) {
        delete window[cbName];
        var script = document.getElementById(cbName);
        if (script) script.remove();
        callback(null, data);
      };
      var payload = encodeURIComponent(JSON.stringify(body));
      var url = API_BASE + '?payload=' + payload + '&callback=' + cbName;
      var script = document.createElement('script');
      script.id = cbName;
      script.src = url;
      script.onerror = function() {
        delete window[cbName];
        script.remove();
        callback(new Error('接続エラー'), null);
      };
      document.body.appendChild(script);
    }

    // ===== STATE =====
    var state = {
      menus: [],
      selectedMenu: null,
      selectedDate: null,
      selectedTime: null,
      closedDays: [],
      closures: {},
      currentMonth: new Date(),
      bufferMin: 10,
      closedDay: 2,
      dailyMax: 10,
      bookableUntil: null
    };

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', function() {
      loadSettings();
    });

    function loadSettings() {
      showLoading('設定を読み込み中...');
      gasGet({ action: 'getSettings' }, function(err, data) {
        hideLoading();
        if (err || !data) { showError('接続エラーが発生しました。しばらくしてから再度お試しください。'); return; }
        if (data.error) { showError(data.error); return; }
        state.menus = data.menus || [];
        state.closedDay = data.closed_day;
        state.bufferMin = data.buffer_min;
        state.dailyMax = data.daily_max_reservations;
        state.bookableUntil = data.bookable_until ? new Date(data.bookable_until + 'T23:59:59') : null;
        renderMenus();
      });
    }

    // ===== MENU RENDERING =====
    function renderMenus() {
      var container = document.getElementById('menuList');
      container.innerHTML = '';
      state.menus.forEach(function(menu) {
        var div = document.createElement('div');
        div.className = 'menu-card';
        div.onclick = function() { selectMenu(menu.name); };
        div.innerHTML =
          '<div>' +
            '<div class="menu-name">' + menu.name + '</div>' +
            '<div class="menu-duration">' + menu.duration + '分</div>' +
          '</div>' +
          '<div class="menu-check"><span style="display:none">✓</span></div>';
        div.dataset.menu = menu.name;
        container.appendChild(div);
      });
    }

    function selectMenu(name) {
      state.selectedMenu = name;
      document.querySelectorAll('.menu-card').forEach(function(card) {
        var isSelected = card.dataset.menu === name;
        card.classList.toggle('selected', isSelected);
        card.querySelector('.menu-check span').style.display = isSelected ? 'inline' : 'none';
      });
      document.getElementById('btnStep1Next').disabled = false;
    }

    // ===== NAVIGATION =====
    function goToStep(step) {
      if (step === 3 && !state.selectedTime) {
        showError('時間を選択してください。');
        return;
      }
      if (step === 4) {
        var name = document.getElementById('inputName').value.trim();
        var email = document.getElementById('inputEmail').value.trim();
        var phone = document.getElementById('inputPhone').value.trim();
        if (!name || !email || !phone) {
          showError('すべての項目を入力してください。');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('メールアドレスの形式が正しくありません。');
          return;
        }
        var menuData = state.menus.find(function(m) { return m.name === state.selectedMenu; });
        var dateObj = new Date(state.selectedDate + 'T00:00:00');
        var dayNames = ['日','月','火','水','木','金','土'];
        var dateStr = dateObj.getFullYear() + '年' +
          (dateObj.getMonth()+1) + '月' + dateObj.getDate() + '日（' +
          dayNames[dateObj.getDay()] + '）';
        var startMin = timeToMin(state.selectedTime);
        var endTime = minToTime(startMin + menuData.duration);

        document.getElementById('confirmMenu').textContent = state.selectedMenu + '（' + menuData.duration + '分）';
        document.getElementById('confirmDateTime').textContent = dateStr + ' ' + state.selectedTime + '〜' + endTime;
        document.getElementById('confirmName').textContent = name;
        document.getElementById('confirmEmail').textContent = email;
        document.getElementById('confirmPhone').textContent = phone;
      }

      clearError();
      document.querySelectorAll('.step-section').forEach(function(s) { s.classList.remove('active'); });
      document.getElementById('step' + step).classList.add('active');

      document.querySelectorAll('.progress-step').forEach(function(ps) {
        var s = parseInt(ps.dataset.step);
        ps.classList.remove('active', 'done');
        if (s < step) ps.classList.add('done');
        if (s === step) ps.classList.add('active');
      });

      if (step === 2) {
        slotCache = {}; weekPage = 0;
        var menuData2 = state.menus.find(function(m) { return m.name === state.selectedMenu; });
        document.getElementById('step2MenuLabel').textContent = state.selectedMenu + '（' + (menuData2 ? menuData2.duration : '') + '分）';
        loadWeekTable();
      }
      document.getElementById('progress').style.display = step === 5 ? 'none' : 'flex';
      window.scrollTo(0, 0);
    }

    // ===== 2-WEEK TABLE =====
    var weekPage = 0; // 0=今週〜来週, 1=来週〜再来週...
    var slotCache = {}; // dateStr -> slots array

    function changeWeekPage(delta) {
      weekPage += delta;
      if (weekPage < 0) weekPage = 0;
      loadWeekTable();
    }

    function getWeekDates() {
      var today = new Date();
      today.setHours(0,0,0,0);
      var start = new Date(today);
      start.setDate(start.getDate() + weekPage * 7);
      var dates = [];
      var limit = state.bookableUntil || new Date(today.getFullYear(), today.getMonth() + 2, 0);
      for (var i = 0; i < 14; i++) {
        var d = new Date(start);
        d.setDate(start.getDate() + i);
        if (d > limit) break;
        dates.push(d);
      }
      return dates;
    }

    function loadWeekTable() {
      var dates = getWeekDates();
      if (dates.length === 0) {
        document.getElementById('slotTableArea').innerHTML = '<div class="slot-table-loading">予約可能な日がありません</div>';
        return;
      }

      // Update label
      var dayNames = ['日','月','火','水','木','金','土'];
      var first = dates[0], last = dates[dates.length - 1];
      document.getElementById('weekLabel').textContent =
        (first.getMonth()+1) + '月';

      // Prev disabled if weekPage=0
      document.getElementById('weekPrev').disabled = (weekPage === 0);

      // Show loading
      document.getElementById('slotTableArea').innerHTML =
        '<div class="slot-table-loading"><div class="spinner" style="margin:0 auto;"></div><div style="margin-top:12px;">空き状況を読み込み中...</div></div>';

      // Load slots for all dates
      var loaded = 0;
      var total = dates.length;
      var allSlots = {};

      dates.forEach(function(d) {
        var ds = formatDateStr(d);

        // Check if closed day or past
        var today = new Date(); today.setHours(0,0,0,0);
        if (d < today || d.getDay() === state.closedDay) {
          allSlots[ds] = { closed: true };
          loaded++;
          if (loaded === total) renderSlotTable(dates, allSlots);
          return;
        }

        // Check cache
        if (slotCache[ds]) {
          allSlots[ds] = slotCache[ds];
          loaded++;
          if (loaded === total) renderSlotTable(dates, allSlots);
          return;
        }

        gasGet({ action: 'getSlots', date: ds, menu: state.selectedMenu }, function(err, data) {
          if (err || !data || data.error || data.closed) {
            allSlots[ds] = { closed: true, reason: (data && data.reason) || '' };
          } else {
            allSlots[ds] = { slots: data.slots || [] };
            slotCache[ds] = allSlots[ds];
          }
          loaded++;
          if (loaded === total) renderSlotTable(dates, allSlots);
        });
      });
    }

    function renderSlotTable(dates, allSlots) {
      var dayNames = ['日','月','火','水','木','金','土'];
      var today = new Date(); today.setHours(0,0,0,0);
      var todayStr = formatDateStr(today);

      // Collect all unique times across all dates
      var timeSet = {};
      dates.forEach(function(d) {
        var ds = formatDateStr(d);
        var info = allSlots[ds];
        if (info && info.slots) {
          info.slots.forEach(function(s) { timeSet[s.time] = true; });
        }
      });
      var times = Object.keys(timeSet).sort();

      if (times.length === 0) {
        document.getElementById('slotTableArea').innerHTML = '<div class="slot-table-loading">空き枠がありません</div>';
        return;
      }

      // Build header
      var html = '<div class="slot-table-wrap"><table class="slot-table"><thead><tr><th>日時</th>';
      dates.forEach(function(d) {
        var ds = formatDateStr(d);
        var dow = d.getDay();
        var clsList = [];
        if (dow === 0) clsList.push('sun');
        if (dow === 6) clsList.push('sat');
        if (dow === state.closedDay) clsList.push('closed-col');
        if (d <= today) clsList.push('past-col');
        if (ds === todayStr) clsList.push('today-col');
        html += '<th class="' + clsList.join(' ') + '">' +
          (d.getMonth()+1) + '/' + d.getDate() + '<br><span style="font-size:10px;">(' + dayNames[dow] + ')</span></th>';
      });
      html += '</tr></thead><tbody>';

      // Build rows
      times.forEach(function(time) {
        var mins = time.split(':');
        var isFullHour = (parseInt(mins[1]) === 0);
        var timeTd = isFullHour
          ? '<td style="font-size:13px;font-weight:700;">' + time + '</td>'
          : '<td>' + time + '</td>';
        html += '<tr>' + timeTd;

        dates.forEach(function(d) {
          var ds = formatDateStr(d);
          var dow = d.getDay();
          var tdClasses = [];
          if (ds === todayStr) tdClasses.push('today-col');
          if (dow === state.closedDay) tdClasses.push('closed-col');
          if (d <= today) tdClasses.push('past-col');
          var tdCls = tdClasses.length ? ' class="' + tdClasses.join(' ') + '"' : '';

          // Closed day or past date — show empty gray cell
          if (dow === state.closedDay || d <= today) {
            html += '<td' + tdCls + '></td>';
            return;
          }

          var info = allSlots[ds];
          if (!info || info.closed) {
            html += '<td' + tdCls + '></td>';
            return;
          }

          var slot = null;
          if (info.slots) {
            for (var i = 0; i < info.slots.length; i++) {
              if (info.slots[i].time === time) { slot = info.slots[i]; break; }
            }
          }

          if (!slot) {
            html += '<td' + tdCls + '></td>';
          } else if (slot.available) {
            var isSelected = (state.selectedDate === ds && state.selectedTime === time);
            var markCls = isSelected ? 'slot-mark avail selected' : 'slot-mark avail';
            html += '<td' + tdCls + '><span class="' + markCls + '" onclick="selectSlotCell(\'' + ds + '\',\'' + time + '\')">◯</span></td>';
          } else {
            html += '<td' + tdCls + '><span class="slot-mark taken">✕</span></td>';
          }
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      document.getElementById('slotTableArea').innerHTML = html;
    }

    function selectSlotCell(dateStr, time) {
      state.selectedDate = dateStr;
      state.selectedTime = time;
      document.getElementById('btnStep2Next').disabled = false;

      // Update visual selection
      document.querySelectorAll('.slot-mark.selected').forEach(function(el) {
        el.classList.remove('selected');
      });
      // Find and select the clicked one
      document.querySelectorAll('.slot-mark.avail').forEach(function(el) {
        if (el.onclick && el.onclick.toString().indexOf(dateStr) !== -1 && el.onclick.toString().indexOf(time) !== -1) {
          el.classList.add('selected');
        }
      });

      // Simpler: re-render to show selection
      var dates = getWeekDates();
      var allSlots = {};
      dates.forEach(function(d) {
        var ds = formatDateStr(d);
        if (slotCache[ds]) allSlots[ds] = slotCache[ds];
        else if (d.getDay() === state.closedDay || d < new Date(new Date().setHours(0,0,0,0))) allSlots[ds] = { closed: true };
        else allSlots[ds] = { closed: true };
      });
      renderSlotTable(dates, allSlots);
    }

    function selectSlot(time) {
      // Legacy - keep for compatibility
      selectSlotCell(state.selectedDate, time);
    }

    // ===== SUBMIT =====
    function submitReservation() {
      var menuData = state.menus.find(function(m) { return m.name === state.selectedMenu; });

      showLoading('空き状況を再確認中...');
      document.getElementById('btnSubmit').disabled = true;

      // 楽観ロック: 確定前にもう一度空きを確認
      gasGet({ action: 'getSlots', date: state.selectedDate, menu: state.selectedMenu }, function(err, slotData) {
        if (err || !slotData) {
          hideLoading();
          document.getElementById('btnSubmit').disabled = false;
          showError('接続エラーが発生しました。');
          return;
        }

        // 選択した枠がまだ空いているか確認
        var stillAvail = false;
        if (slotData.slots) {
          for (var i = 0; i < slotData.slots.length; i++) {
            if (slotData.slots[i].time === state.selectedTime && slotData.slots[i].available) {
              stillAvail = true; break;
            }
          }
        }
        if (!stillAvail) {
          hideLoading();
          document.getElementById('btnSubmit').disabled = false;
          showError('申し訳ございません。この枠はすでに予約が入りました。別の日時を選択してください。');
          // キャッシュをクリアして再表示
          slotCache = {};
          goToStep(2);
          return;
        }

        // 空いていたので予約実行
        var body = {
          action: 'createReservation',
          customer_name: document.getElementById('inputName').value.trim(),
          customer_email: document.getElementById('inputEmail').value.trim(),
          customer_phone: document.getElementById('inputPhone').value.trim(),
          menu: state.selectedMenu,
          date: state.selectedDate,
          start_time: state.selectedTime
        };

        document.getElementById('loadingText').textContent = '予約を確定しています...';

        gasPost(body, function(err2, data) {
          hideLoading();
          if (err2 || !data) {
            document.getElementById('btnSubmit').disabled = false;
            showError('接続エラーが発生しました。しばらくしてから再度お試しください。');
            return;
          }
          if (data.error) {
            document.getElementById('btnSubmit').disabled = false;
            showError(data.error);
            return;
          }

          var dateObj = new Date(state.selectedDate + 'T00:00:00');
          var dayNames = ['日','月','火','水','木','金','土'];
          var dateStr = dateObj.getFullYear() + '年' +
            (dateObj.getMonth()+1) + '月' + dateObj.getDate() + '日（' +
            dayNames[dateObj.getDay()] + '）';
          var startMin = timeToMin(state.selectedTime);
          var endTime = minToTime(startMin + menuData.duration);

          document.getElementById('completeMenu').textContent = state.selectedMenu + '（' + menuData.duration + '分）';
          document.getElementById('completeDateTime').textContent = dateStr + ' ' + state.selectedTime + '〜' + endTime;

          goToStep(5);
        });
      });
    }

    // ===== UTILS =====
    function formatDateStr(date) {
      var y = date.getFullYear();
      var m = ('0' + (date.getMonth() + 1)).slice(-2);
      var d = ('0' + date.getDate()).slice(-2);
      return y + '-' + m + '-' + d;
    }
    function timeToMin(t) {
      var p = t.split(':');
      return parseInt(p[0]) * 60 + parseInt(p[1]);
    }
    function minToTime(m) {
      return ('0' + Math.floor(m/60)).slice(-2) + ':' + ('0' + (m%60)).slice(-2);
    }
    function showLoading(msg) {
      document.getElementById('loadingText').textContent = msg || '読み込み中...';
      document.getElementById('loadingOverlay').classList.add('show');
    }
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('show');
    }
    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
      window.scrollTo(0, 0);
    }
    function clearError() {
      document.getElementById('errorMsg').classList.remove('show');
    }
  </script>
</body>
</html>

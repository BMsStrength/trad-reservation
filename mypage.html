<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>マイページ | TRAD パーソナルコンディショニングジム</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-blue: #0B3D91;
      --brand-blue-light: #1565C0;
      --brand-blue-pale: #E3F2FD;
      --white: #FFFFFF;
      --gray-50: #FAFAFA;
      --gray-100: #F5F5F5;
      --gray-200: #EEEEEE;
      --gray-300: #E0E0E0;
      --gray-500: #9E9E9E;
      --gray-600: #757575;
      --gray-700: #616161;
      --gray-900: #212121;
      --success: #2E7D32;
      --danger: #C62828;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }
    .header {
      background: var(--brand-blue);
      color: var(--white);
      padding: 16px 20px;
      text-align: center;
    }
    .header-brand { font-size:24px; font-weight:900; letter-spacing:4px; }
    .header-sub { font-size:11px; opacity:0.85; letter-spacing:2px; margin-top:2px; }
    .container { max-width:480px; margin:0 auto; padding:20px 16px 40px; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-title { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; }

    .greeting { font-size:16px; font-weight:700; margin-bottom:16px; }
    .greeting small { display:block; font-size:12px; font-weight:400; color:var(--gray-600); margin-top:2px; }

    /* 回数券 */
    .ticket-card {
      background: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-blue-light) 100%);
      color: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .ticket-label { font-size:12px; opacity:0.85; letter-spacing:1px; }
    .ticket-remain { font-size:40px; font-weight:900; line-height:1.2; }
    .ticket-remain small { font-size:16px; font-weight:700; }
    .ticket-meta { font-size:12px; opacity:0.85; margin-top:6px; }

    /* 予約アイテム */
    .resv-item { border:1px solid var(--gray-200); border-radius:var(--radius-sm); padding:14px; margin-bottom:10px; }
    .resv-item:last-child { margin-bottom:0; }
    .resv-date { font-size:15px; font-weight:700; }
    .resv-menu { font-size:13px; color:var(--gray-600); margin-top:2px; }
    .resv-actions { display:flex; gap:8px; margin-top:10px; }
    .resv-note { font-size:11px; color:var(--gray-500); margin-top:8px; }
    .badge-recurring {
      display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px;
      background:#FFF3E0; color:#E65100; margin-left:6px; vertical-align:middle;
    }

    .past-item { display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--gray-100); font-size:13px; }
    .past-item:last-child { border-bottom:none; }
    .past-date { font-weight:500; }
    .past-menu { color:var(--gray-600); }

    .btn {
      padding:10px 14px; border:none; border-radius:var(--radius-sm);
      font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;
    }
    .btn-block { width:100%; padding:14px; font-size:15px; }
    .btn-primary { background:var(--brand-blue); color:var(--white); }
    .btn-primary:hover { background:#0A337A; }
    .btn-outline { background:var(--white); color:var(--gray-700); border:1.5px solid var(--gray-300); }
    .btn-outline-danger { background:var(--white); color:var(--danger); border:1.5px solid #FFCDD2; }
    .btn:disabled { opacity:0.5; cursor:default; }

    .input {
      width:100%; padding:12px; border:1px solid var(--gray-300); border-radius:var(--radius-sm);
      font-size:15px; font-family:inherit; margin-bottom:12px;
    }
    .input-label { font-size:13px; font-weight:600; display:block; margin-bottom:4px; }

    .msg { padding:14px 16px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:14px; }
    .msg-error { background:#FFEBEE; color:var(--danger); }
    .msg-success { background:#E8F5E9; color:var(--success); }
    .msg-info { background:var(--brand-blue-pale); color:var(--brand-blue); }

    .empty { text-align:center; color:var(--gray-500); font-size:13px; padding:14px 0; }

    .loading { text-align:center; padding:60px 20px; color:var(--gray-500); font-size:13px; }
    .spinner { width:32px; height:32px; border:3px solid var(--gray-200); border-top-color:var(--brand-blue); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .footer-link { text-align:center; margin-top:20px; }
    .footer-link a, .footer-link button {
      background:none; border:none; color:var(--gray-500); font-size:12px; text-decoration:underline;
      cursor:pointer; font-family:inherit;
    }
    .toggle-past { background:none; border:none; color:var(--brand-blue); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }

    /* 最新に更新 */
    .sync-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .sync-info { font-size:11px; color:var(--gray-500); line-height:1.4; }
    .sync-info.ok { color:var(--success); font-weight:700; }
    .btn-refresh {
      flex:none; background:var(--white); color:var(--brand-blue);
      border:1.5px solid var(--brand-blue); border-radius:20px;
      padding:7px 14px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer;
      display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
    }
    .btn-refresh:disabled { opacity:0.6; cursor:default; }
    .btn-refresh .ico { display:inline-block; font-size:14px; line-height:1; }
    .btn-refresh.loading .ico { animation:spin 0.8s linear infinite; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-brand">TRAD<span style="font-size:10px;vertical-align:super;">™</span></div>
    <div class="header-sub">MY PAGE</div>
  </div>

  <div class="container">
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        読み込んでいます...
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // LINE DevelopersのLIFFアプリのID（チャネル: TRADマイページ）
    var LIFF_ID = '2010638065-5NakTfBo';

    var API_BASE = 'https://script.google.com/macros/s/AKfycbxzphUXhjAEwxFsj6napghnfRZh7R7p15L_iDfKwM9p56wdRrDsIbQrXzggFdqjgihY/exec';
    var API_TIMEOUT_MS = 25000;
    var API_RETRY_MAX = 2;
    var SESSION_KEY = 'trad_mypage_session';
    var CACHE_KEY = 'trad_mypage_cache';

    var lastSyncAt = 0; // このデータをサーバーから受け取った時刻（ms）

    function readCache() {
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        var c = JSON.parse(raw);
        if (!(c && c.data && c.data.member)) return null;
        lastSyncAt = c.t || 0;
        return c.data;
      } catch (e) { return null; }
    }
    function writeCache(data) {
      lastSyncAt = Date.now();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: lastSyncAt, data: data })); } catch (e) {}
    }
    function clearCache() {
      try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
    }

    function gasPost(body, cb, reqOpts, attempt) {
      attempt = attempt || 0;
      reqOpts = reqOpts || {};
      var timeoutMs = reqOpts.timeoutMs || API_TIMEOUT_MS;
      var retryMax = (reqOpts.retryMax != null) ? reqOpts.retryMax : API_RETRY_MAX;
      var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var opts = {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(body)
      };
      if (controller) opts.signal = controller.signal;
      var timedOut = false;
      var timer = controller ? setTimeout(function() { timedOut = true; controller.abort(); }, timeoutMs) : null;
      fetch(API_BASE, opts)
        .then(function(res) { if (timer) clearTimeout(timer); return res.json(); })
        .then(function(data) { cb(null, data); })
        .catch(function(err) {
          if (timer) clearTimeout(timer);
          if (attempt < retryMax) {
            setTimeout(function() { gasPost(body, cb, reqOpts, attempt + 1); }, 800 * (attempt + 1));
            return;
          }
          cb(err, null, timedOut);
        });
    }

    var $c = document.getElementById('content');
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }
    function showLoading(text) {
      $c.innerHTML = '<div class="loading"><div class="spinner"></div>' + esc(text || '読み込んでいます...') + '</div>';
    }
    function showError(text, retryFn) {
      $c.innerHTML = '<div class="msg msg-error">' + esc(text) + '</div>' +
        (retryFn ? '<button class="btn btn-primary btn-block" id="retryBtn">再読み込み</button>' : '');
      if (retryFn) document.getElementById('retryBtn').onclick = retryFn;
    }

    // ---------- 起動フロー ----------
    function boot() {
      liff.init({ liffId: LIFF_ID })
        .then(function() {
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }
          var session = localStorage.getItem(SESSION_KEY);
          if (session) {
            // 前回の内容を即表示し、裏で最新に更新（体感速度対策）
            var cached = readCache();
            if (cached) {
              currentData = cached;
              renderMyPage(cached, true);
            }
            // 裏側の取得ではサーバー側のキャッシュ（回数券台帳5分・カレンダー3分）を使う。
            // 毎回無視していると、台帳への問い合わせだけで9秒以上かかり開くたびに待たされる。
            // 必ず最新にしたいときは「⟳最新に更新」を押していただく。
            loadData(session, !!cached);
          } else {
            doLogin();
          }
        })
        .catch(function(err) {
          showError('LINEログインの初期化に失敗しました。LINEアプリから開き直してください。（' + (err && err.message || err) + '）');
        });
    }

    function doLogin() {
      var idToken = liff.getIDToken();
      if (!idToken) {
        // IDトークン期限切れ等 → 再ログイン
        liff.logout();
        liff.login({ redirectUri: window.location.href });
        return;
      }
      showLoading('ログインしています...');
      // ログインは「LINEの確認 → 予約・回数券の取得」まで1回で行う一番重い処理。
      // 25秒で打ち切って自動リトライすると、サーバー側は動き続けたまま
      // 同じ処理が重なって余計に遅くなるので、待つ時間を延ばしてリトライしない。
      gasPost({ action: 'mypageLogin', id_token: idToken }, function(err, data, timedOut) {
        if (err || !data) {
          showError(timedOut
            ? '読み込みに時間がかかっています。電波の良い場所で、もう一度お試しください。'
            : '接続エラーが発生しました。', boot);
          return;
        }
        if (data.error) { showError(data.error, boot); return; }
        if (data.need_link) { renderLinkForm(); return; }
        localStorage.setItem(SESSION_KEY, data.sessionToken);
        if (data.upcoming) {
          // ログイン応答にデータ同梱済み（1往復で表示）
          currentData = data;
          writeCache(data);
          renderMyPage(data);
        } else {
          loadData(data.sessionToken);
        }
      }, { timeoutMs: 60000, retryMax: 0 });
    }

    // ---------- 初回のメール認証（LINEアカウント紐づけ） ----------
    function renderLinkForm() {
      $c.innerHTML =
        '<div class="card">' +
          '<div class="card-title">はじめまして</div>' +
          '<div class="msg msg-info">初回のみ、お名前とご予約時にお使いのメールアドレスの確認をお願いします。次回からはLINEを開くだけでログインできます。</div>' +
          '<label class="input-label">お名前（フルネーム）</label>' +
          '<input type="text" class="input" id="linkName" placeholder="例）山田 太郎" autocomplete="name">' +
          '<label class="input-label">メールアドレス</label>' +
          '<input type="email" class="input" id="linkEmail" placeholder="taro@example.com" autocomplete="email">' +
          '<button class="btn btn-primary btn-block" id="sendCodeBtn">認証コードを送信</button>' +
          '<div id="codeArea" style="display:none;margin-top:16px;">' +
            '<label class="input-label">認証コード（メールに届いた6桁の数字）</label>' +
            '<input type="text" class="input" id="linkCode" inputmode="numeric" maxlength="6" placeholder="123456">' +
            '<button class="btn btn-primary btn-block" id="verifyBtn">確認してログイン</button>' +
          '</div>' +
          '<div id="linkMsg"></div>' +
        '</div>';

      document.getElementById('sendCodeBtn').onclick = sendCode;
      document.getElementById('verifyBtn').onclick = verifyCode;
    }

    function setLinkMsg(text, cls) {
      document.getElementById('linkMsg').innerHTML =
        text ? '<div class="msg ' + cls + '" style="margin-top:12px;margin-bottom:0;">' + esc(text) + '</div>' : '';
    }

    function sendCode() {
      var name = document.getElementById('linkName').value.trim();
      var email = document.getElementById('linkEmail').value.trim();
      if (!name) { setLinkMsg('お名前（フルネーム）を入力してください。', 'msg-error'); return; }
      if (!email) { setLinkMsg('メールアドレスを入力してください。', 'msg-error'); return; }
      var btn = document.getElementById('sendCodeBtn');
      btn.disabled = true; btn.textContent = '送信中...';
      gasPost({ action: 'mypageRequestLink', id_token: liff.getIDToken(), email: email }, function(err, data) {
        btn.disabled = false; btn.textContent = '認証コードを再送する';
        if (err || !data) { setLinkMsg('接続エラーが発生しました。', 'msg-error'); return; }
        if (data.error) { setLinkMsg(data.error, 'msg-error'); return; }
        document.getElementById('codeArea').style.display = 'block';
        setLinkMsg('認証コードをメールに送信しました。届かない場合は迷惑メールフォルダもご確認ください。', 'msg-success');
      }, { timeoutMs: 60000, retryMax: 0 });
    }

    function verifyCode() {
      var name = document.getElementById('linkName').value.trim();
      var email = document.getElementById('linkEmail').value.trim();
      var code = document.getElementById('linkCode').value.trim();
      if (!name) { setLinkMsg('お名前（フルネーム）を入力してください。', 'msg-error'); return; }
      if (!code) { setLinkMsg('認証コードを入力してください。', 'msg-error'); return; }
      var btn = document.getElementById('verifyBtn');
      btn.disabled = true; btn.textContent = '確認中...';
      gasPost({ action: 'mypageVerifyLink', id_token: liff.getIDToken(), email: email, code: code, full_name: name }, function(err, data) {
        btn.disabled = false; btn.textContent = '確認してログイン';
        if (err || !data) { setLinkMsg('接続エラーが発生しました。', 'msg-error'); return; }
        if (data.error) { setLinkMsg(data.error, 'msg-error'); return; }
        localStorage.setItem(SESSION_KEY, data.sessionToken);
        if (data.upcoming) {
          currentData = data;
          writeCache(data);
          renderMyPage(data);
        } else {
          loadData(data.sessionToken);
        }
      }, { timeoutMs: 60000, retryMax: 0 });
    }

    // ---------- データ取得・表示 ----------
    var currentData = null;

    /**
     * データ取得
     * silent: 画面を消さずに裏で取得する（キャッシュ表示中）
     * force : サーバー側のキャッシュ（回数券台帳5分・カレンダー3分）も無視して取り直す
     * done  : 完了コールバック（err, refreshed）
     */
    function loadData(sessionToken, silent, force, done) {
      if (!silent) showLoading();
      var body = { action: 'mypageGetData', sessionToken: sessionToken };
      if (force) body.force = true;
      var reqOpts = { timeoutMs: 45000, retryMax: 1 };
      gasPost(body, function(err, data) {
        if (err || !data) {
          if (done) { done(err || new Error('no data')); return; }
          if (silent) { resetRefreshBtn('最新の情報を取得できませんでした。'); return; } // キャッシュ表示中なら静かに諦める
          showError('接続エラーが発生しました。', function() { loadData(sessionToken); });
          return;
        }
        if (data.need_login) {
          localStorage.removeItem(SESSION_KEY);
          clearCache();
          doLogin();
          return;
        }
        if (data.error) {
          if (done) { done(new Error(data.error)); return; }
          if (silent) { resetRefreshBtn('最新の情報を取得できませんでした。'); return; }
          showError(data.error, function() { loadData(sessionToken); });
          return;
        }
        currentData = data;
        writeCache(data);
        renderMyPage(data, false, !!force && !!done);
        if (done) done(null);
      }, reqOpts);
    }

    /** 更新ボタンを押せる状態に戻す（メッセージ任意） */
    function resetRefreshBtn(msg) {
      var b = document.getElementById('refreshBtn');
      var i = document.getElementById('syncInfo');
      if (b) {
        b.disabled = false;
        b.classList.remove('loading');
        b.innerHTML = '<span class="ico">⟳</span>最新に更新';
      }
      if (i) {
        i.className = 'sync-info';
        i.textContent = msg || (lastSyncAt ? '最終更新 ' + fmtClock(lastSyncAt) : '');
      }
    }

    /** 「最新に更新」ボタン */
    function doRefresh() {
      var session = localStorage.getItem(SESSION_KEY);
      if (!session) { doLogin(); return; }
      var btn = document.getElementById('refreshBtn');
      var info = document.getElementById('syncInfo');
      if (btn) {
        btn.disabled = true;
        btn.classList.add('loading');
        btn.innerHTML = '<span class="ico">⟳</span>更新中...';
      }
      if (info) { info.className = 'sync-info'; info.textContent = '最新の情報を取得しています...'; }

      loadData(session, true, true, function(err) {
        if (!err) return; // 成功時は画面が再描画される
        resetRefreshBtn('更新できませんでした。通信状況をご確認のうえ、もう一度お試しください。');
      });
    }

    function fmtClock(ms) {
      if (!ms) return '';
      var d = new Date(ms);
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }

    function fmtDateJa(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      var dayNames = ['日','月','火','水','木','金','土'];
      return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + dayNames[d.getDay()] + '）';
    }

    function renderMyPage(data, isStale, justRefreshed) {
      var html = '';
      html += '<div class="greeting">' + esc(data.member.display_name) + ' さん' +
        '<small>マイページへようこそ</small></div>';

      // 最終更新の表示＋手動更新ボタン
      var infoCls = 'sync-info' + (justRefreshed ? ' ok' : '');
      var infoText = isStale ? '最新の情報を確認しています...'
        : (justRefreshed ? '最新の情報に更新しました（' + fmtClock(lastSyncAt) + '）'
          : (lastSyncAt ? '最終更新 ' + fmtClock(lastSyncAt) : ''));
      html += '<div class="sync-bar">' +
          '<div class="' + infoCls + '" id="syncInfo">' + esc(infoText) + '</div>' +
          '<button class="btn-refresh" id="refreshBtn"><span class="ico">⟳</span>最新に更新</button>' +
        '</div>';

      // 回数券（本人分と、ペア共用分は分けて表示）
      if (data.tickets && data.tickets.available) {
        data.tickets.items.forEach(function(t) {
          var label = esc(t.type || '回数券') + (t.pair ? '（ペア共用）' : '');
          html += '<div class="ticket-card"' + (t.pair ? ' style="background:linear-gradient(135deg,#4A2E91 0%,#6A4CBF 100%);"' : '') + '>' +
            '<div class="ticket-label">' + label + '</div>' +
            '<div class="ticket-remain">残り ' + (isNaN(t.remain) ? '-' : esc(t.remain)) + '<small> 回</small></div>' +
            '<div class="ticket-meta">' +
              (t.total ? '全' + esc(t.total) + '回' : '') +
              (t.purchase_date ? '（購入日 ' + esc(t.purchase_date) + '）' : '') +
            '</div>' +
          '</div>';
        });
      }

      // 今後の予約
      html += '<div class="card"><div class="card-title">今後のご予約</div>';
      if (!data.upcoming || data.upcoming.length === 0) {
        html += '<div class="empty">今後のご予約はありません。</div>';
      } else {
        data.upcoming.forEach(function(r, idx) {
          html += '<div class="resv-item">' +
            '<div class="resv-date">' + fmtDateJa(r.date) + ' ' + esc(r.start_time) + '〜' + esc(r.end_time) +
              (r.is_recurring ? '<span class="badge-recurring">繰り返し</span>' : '') +
            '</div>' +
            '<div class="resv-menu">' + esc(r.menu) + '（' + esc(r.duration_min) + '分）</div>';
          if (r.is_calendar) {
            html += '<div class="resv-note">この予約の変更・キャンセルはジムに直接ご連絡ください。</div>';
          } else if (r.can_modify && r.cancel_token) {
            html += '<div class="resv-actions">' +
              '<button class="btn btn-outline" onclick="goChange(' + idx + ')">日時を変更</button>' +
              '<button class="btn btn-outline-danger" onclick="doCancel(' + idx + ')">キャンセル</button>' +
            '</div>' +
            (r.is_recurring
              ? '<div class="resv-note">変更・キャンセルはこの回のみに適用されます（以降の繰り返しのご予約はそのままです）。前日23:59まで操作できます。</div>'
              : '<div class="resv-note">前日23:59まで変更・キャンセルできます。</div>');
          } else {
            html += '<div class="resv-note">変更・キャンセル期限（前日23:59）を過ぎています。ご都合が悪い場合は直接ご連絡ください。</div>';
          }
          html += '</div>';
        });
      }
      html += '</div>';

      // 予約を追加
      html += '<a href="index.html" style="text-decoration:none;"><button class="btn btn-primary btn-block" style="margin-bottom:16px;">新しく予約する</button></a>';

      // 過去の予約
      html += '<div class="card"><div class="card-title">過去のご予約' +
        (data.past_total ? '<span style="font-size:12px;color:var(--gray-500);font-weight:400;">全' + esc(data.past_total) + '回</span>' : '') +
        '</div>';
      if (!data.past || data.past.length === 0) {
        html += '<div class="empty">過去のご予約はまだありません。</div>';
      } else {
        var visible = data.past.slice(0, 5);
        var hidden = data.past.slice(5);
        html += '<div id="pastVisible">';
        visible.forEach(function(r) {
          html += '<div class="past-item"><span class="past-date">' + esc(r.date) + ' ' + esc(r.start_time) + '</span>' +
            '<span class="past-menu">' + esc(r.menu) + '</span></div>';
        });
        html += '</div>';
        if (hidden.length > 0) {
          html += '<div id="pastHidden" style="display:none;">';
          hidden.forEach(function(r) {
            html += '<div class="past-item"><span class="past-date">' + esc(r.date) + ' ' + esc(r.start_time) + '</span>' +
              '<span class="past-menu">' + esc(r.menu) + '</span></div>';
          });
          html += '</div>' +
            '<div style="text-align:center;margin-top:8px;">' +
              '<button class="toggle-past" id="togglePastBtn">もっと見る</button>' +
            '</div>';
        }
      }
      html += '</div>';

      html += '<div class="footer-link"><button id="logoutBtn">ログアウト</button></div>';

      $c.innerHTML = html;

      var refreshBtn = document.getElementById('refreshBtn');
      if (refreshBtn) {
        refreshBtn.onclick = doRefresh;
        if (isStale) { refreshBtn.disabled = true; refreshBtn.classList.add('loading'); }
      }
      if (justRefreshed) {
        setTimeout(function() {
          var i = document.getElementById('syncInfo');
          if (i && i.className.indexOf('ok') >= 0) {
            i.className = 'sync-info';
            i.textContent = '最終更新 ' + fmtClock(lastSyncAt);
          }
        }, 4000);
      }

      var toggleBtn = document.getElementById('togglePastBtn');
      if (toggleBtn) {
        toggleBtn.onclick = function() {
          var hiddenDiv = document.getElementById('pastHidden');
          var show = hiddenDiv.style.display === 'none';
          hiddenDiv.style.display = show ? 'block' : 'none';
          toggleBtn.textContent = show ? '閉じる' : 'もっと見る';
        };
      }
      document.getElementById('logoutBtn').onclick = function() {
        localStorage.removeItem(SESSION_KEY);
        clearCache();
        try { liff.logout(); } catch (e) {}
        window.location.reload();
      };
    }

    // ---------- 予約の変更・キャンセル ----------
    function goChange(idx) {
      var r = currentData.upcoming[idx];
      if (!r || !r.cancel_token) return;
      window.location.href = 'manage.html?token=' + encodeURIComponent(r.cancel_token);
    }

    function doCancel(idx) {
      var r = currentData.upcoming[idx];
      if (!r || !r.cancel_token) return;
      var cancelMsg = fmtDateJa(r.date) + ' ' + r.start_time + ' の予約をキャンセルしますか？';
      if (r.is_recurring) cancelMsg += '\n（この回のみのキャンセルです。以降の繰り返しのご予約はそのまま残ります）';
      if (!confirm(cancelMsg)) return;

      showLoading('キャンセルしています...');
      gasPost({ action: 'cancelReservation', token: r.cancel_token }, function(err, data, timedOut) {
        if (timedOut) {
          alert('通信がタイムアウトしました。キャンセルが完了している場合はキャンセル完了メールが届いています。最新の予約状況を確認します。');
          loadData(localStorage.getItem(SESSION_KEY));
          return;
        }
        if (err || !data) { showError('接続エラーが発生しました。', function() { loadData(localStorage.getItem(SESSION_KEY)); }); return; }
        if (data.error) {
          alert(data.error);
        }
        loadData(localStorage.getItem(SESSION_KEY));
      }, { timeoutMs: 60000, retryMax: 0 });
    }

    boot();
  </script>
</body>
</html>
